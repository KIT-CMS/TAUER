mc_weights:
  # ── Common weights applied to all channels and eras ──────────────────────────
  # TFF keys: generator → xsec/genWeight; lumi → luminosity; empty string = skip
  common:
    Top_pt_reweighting: topPtReweightWeight
    Z_pt_reweighting: zPtReweightWeight
    generator: ""
    lumi: ""
    pileup: puweight
    btag_reweighting: btag_weight

  # ── Channel-specific weights ──────────────────────────────────────────────────
  # vsEle/vsMu SFs ungated: correctionlib is already gen_match-aware (non-1 only for e/mu->tau fakes)
  et:
    had_tau_id_vs_ele: id_wgt_tau_vsEle_Tight_2
    had_tau_id_vs_mu: id_wgt_tau_vsMu_VLoose_Tight_2
    lep_id: id_wgt_ele_wp90iso_1
    lep_iso: 1
    single_trigger: trg_wgt_single_ele30

  mt:
    had_tau_id_vs_ele: id_wgt_tau_vsEle_VVLoose_2
    had_tau_id_vs_mu: id_wgt_tau_vsMu_Tight_VVLoose_2
    lep_id: id_wgt_mu_1
    lep_iso: iso_wgt_mu_1
    single_trigger: trg_wgt_single_mu24

  tt:
    had_tau_id_vs_ele_1: id_wgt_tau_vsEle_VVLoose_1
    had_tau_id_vs_ele_2: id_wgt_tau_vsEle_VVLoose_2
    had_tau_id_vs_mu_1: id_wgt_tau_vsMu_VLoose_VVLoose_1
    had_tau_id_vs_mu_2: id_wgt_tau_vsMu_VLoose_VVLoose_2
    # Trigger weight: era-dependent (ditau35 up to 2023postBPix, ditau30_pnet from 2024)
    double_trigger: "(trg_wgt_doubletau35_leg1 * trg_wgt_doubletau35_leg2)"
    era_overrides:
      '2024':
        double_trigger: "(trg_wgt_doubletau30_leg1 * trg_wgt_doubletau30_leg2)"
      '2025':
        double_trigger: "(trg_wgt_doubletau30_leg1 * trg_wgt_doubletau30_leg2)"
      '2026':
        double_trigger: "(trg_wgt_doubletau30_leg1 * trg_wgt_doubletau30_leg2)"
