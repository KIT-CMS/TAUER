# Integrated luminosity per era, in fb^-1. Single source of truth for the
# lumi_weight() term in config/shapes/process_selection.py (converted to
# pb^-1 there via *1000.0, matching crossSectionPerEventWeight's units), and
# for the CMS lumi label in plotting/plot_shapes_control.py.
#
# Run2 entries (2016preVFP/postVFP, 2017, 2018) are UL-recommended values
# carried over from smhtt_ul's Dumbledraw plotting script (DrawLumi() era
# branch in plotting/plot_shapes_control.py there). Run2 shape *production*
# is out of scope for this rework (config/shapes/*.py and config/samples.yaml
# :backgrounds/:signals only cover Run3 — see RUN3_ERAS in config/analysis.py)
# — these four values exist solely so the Run2-2018 validation ntuples can be
# plotted with an era-correct CMS label (Phase 2b).
luminosity:
  2016preVFP: 19.5
  2016postVFP: 16.8
  '2017': 41.5
  # Phase 6a (2026-07-15): this key used to appear twice in this map -- a
  # second '2018': 59.8 entry (Phase 2b's smhtt_ul DrawLumi() plotting value)
  # was silently shadowed by this one (Phase 2a's production-side value,
  # matching smhtt_ul's live lumi_weight()) since YAML keeps only the last
  # duplicate key. Both get_luminosity() call sites (production weight AND
  # the CMS plot label) already read this single surviving value -- removed
  # the dead duplicate rather than leaving two numbers for the same key.
  '2018': 59.83
  2022preEE: 8.086
  2022postEE: 26.679
  2023preBPix: 17.964
  2023postBPix: 9.677
  '2024': 109.816
  '2025': 109.898

