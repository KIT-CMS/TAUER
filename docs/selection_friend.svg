<svg xmlns="http://www.w3.org/2000/svg" width="1518" height="596" viewBox="0 0 1518 596" role="img" aria-label="How the CROWN selection friend builds the weight and the masks, and which TAUER step reads each column"><style>
:root{--bg:#ffffff;--surface:#ffffff;--panel:#e9f1ef;--ink:#10201c;--ink-2:#354a45;--muted:#586d68;--line:#bfd2cd;--tauer:#0b7a63;--crown:#1f4e9c;--ext-fill:#e9effa;--artifact:#d8ece6;--loop:#2a8bd6;--friend:#3f9a36}
@media (prefers-color-scheme:dark){:root{--bg:#0b1311;--surface:#13201d;--panel:#101a18;--ink:#e6f2ef;--ink-2:#b2c8c2;--muted:#8aa39c;--line:#26403a;--tauer:#4cba98;--crown:#7ea9f2;--ext-fill:#141f33;--artifact:#1a302b;--loop:#6ec1ff;--friend:#8fdc7a}}
svg{font-family:"Helvetica Neue",Arial,sans-serif}
.bgr{fill:var(--bg)}
.band{fill:var(--panel);stroke:var(--line)}
.n rect{stroke-width:1.6}.n-step rect{fill:var(--surface);stroke:var(--tauer)}.n-ext rect{fill:var(--ext-fill);stroke:var(--crown);stroke-dasharray:6 4}.n-data rect{fill:var(--artifact);stroke:var(--line)}
.t-title{font-weight:600;font-size:13.5px;fill:var(--ink)}
.t-cap{font-weight:600;font-size:10.5px;letter-spacing:.08em;fill:var(--crown)}
.t-sub,.t-cmd{font:10.5px ui-monospace,Menlo,Consolas,monospace;fill:var(--muted)}
.t-lane{font-weight:700;font-size:11px;letter-spacing:.1em;fill:var(--tauer)}
.t-edge{font-weight:500;font-size:11px;fill:var(--ink-2);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.t-loop{fill:var(--loop)}.t-friend{fill:var(--friend)}.t-rebuild{fill:var(--crown)}.t-rebuild{font-weight:600}
.e{fill:none;stroke:var(--ink-2);stroke-width:1.5}.e-loop{stroke:var(--loop);stroke-dasharray:7 5}
.e-friend{stroke:var(--friend);stroke-width:2}.e-rebuild{stroke:var(--crown);stroke-width:3}
.mk{fill:var(--ink-2)}.mk-loop{fill:var(--loop)}.mk-friend{fill:var(--friend)}.mk-rebuild{fill:var(--crown)}

.band{fill:var(--panel);stroke:var(--line)}.t-note{font-size:11.5px;fill:var(--ink-2)}.t-sub{font-size:10px}
.n-csh rect{fill:var(--surface);stroke:var(--tauer);stroke-width:2.4}.n-cff rect{fill:var(--surface);stroke:var(--crown);stroke-width:2.4}.n-cbt rect{fill:var(--surface);stroke:var(--loop);stroke-width:2.4}
.chip rect{stroke-width:1.4;fill-opacity:.14}.chip text{font-weight:600;font-size:10px}
.chip-sh rect{fill:var(--tauer);stroke:var(--tauer)}.chip-sh text{fill:var(--tauer)}
.chip-ff rect{fill:var(--crown);stroke:var(--crown)}.chip-ff text{fill:var(--crown)}
.chip-bt rect{fill:var(--loop);stroke:var(--loop)}.chip-bt text{fill:var(--loop)}</style><rect class="bgr" width="1518" height="596"/><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="band" x="6" y="24" width="1506" height="172" rx="12"/><rect class="band" x="6" y="208" width="1506" height="204" rx="12"/><rect class="band" x="6" y="424" width="1506" height="158" rx="12"/><path class="e" d="M176,92 L202,92" marker-end="url(#mi)"/><path class="e" d="M366,92 L392,92" marker-end="url(#mi)"/><path class="e" d="M556,92 L582,92" marker-end="url(#mi)"/><path class="e" d="M746,92 L772,92" marker-end="url(#mi)"/><path class="e" d="M936,92 L962,92" marker-end="url(#mi)"/><path class="e" d="M1126,92 L1152,92" marker-end="url(#mi)"/><path class="e" d="M1316,92 L1342,92" marker-end="url(#mi)"/><path class="e" d="M176,306 L202,306" marker-end="url(#mi)"/><path class="e" d="M366,306 L392,306" marker-end="url(#mi)"/><g class="n n-step"><rect x="12" y="60" width="164" height="64" rx="10"/><text class="t-title" x="94.0" y="82" text-anchor="middle">normalisation</text><text class="t-sub" x="94.0" y="99" text-anchor="middle">norm table, STXS norm</text><text class="t-sub" x="94.0" y="114" text-anchor="middle">gen sign, pileup</text></g><g class="n n-step"><rect x="202" y="60" width="164" height="64" rx="10"/><text class="t-title" x="284.0" y="82" text-anchor="middle">lepton and tau IDs</text><text class="t-sub" x="284.0" y="99" text-anchor="middle">tau gate + vsJet/Mu/Ele</text><text class="t-sub" x="284.0" y="114" text-anchor="middle">e/mu ID and iso SF</text></g><g class="n n-step"><rect x="392" y="60" width="164" height="64" rx="10"/><text class="t-title" x="474.0" y="82" text-anchor="middle">trigger SF</text><text class="t-sub" x="474.0" y="99" text-anchor="middle">trg_wgt, Run 3 only</text></g><g class="n n-step"><rect x="582" y="60" width="164" height="64" rx="10"/><text class="t-title" x="664.0" y="82" text-anchor="middle">process reweighting</text><text class="t-sub" x="664.0" y="99" text-anchor="middle">Z pT, top pT, ggH NNLO</text><text class="t-sub" x="664.0" y="114" text-anchor="middle">LHE scale (signals)</text></g><g class="n n-step"><rect x="772" y="60" width="164" height="64" rx="10"/><text class="t-title" x="854.0" y="82" text-anchor="middle">MC campaign split</text><text class="t-sub" x="854.0" y="99" text-anchor="middle">campaign split factor</text></g><g class="n n-data"><rect x="962" y="60" width="164" height="64" rx="26"/><text class="t-title" x="1044.0" y="82" text-anchor="middle">weight_no_btag</text><text class="t-sub" x="1044.0" y="99" text-anchor="middle">et mt tt em</text></g><g class="n n-step"><rect x="1152" y="60" width="164" height="64" rx="10"/><text class="t-title" x="1234.0" y="82" text-anchor="middle">x btag_weight</text><text class="t-sub" x="1234.0" y="99" text-anchor="middle">efficiency payload</text></g><g class="n n-data"><rect x="1342" y="60" width="164" height="64" rx="26"/><text class="t-title" x="1424.0" y="82" text-anchor="middle">weight</text><text class="t-sub" x="1424.0" y="99" text-anchor="middle">MC event weight</text></g><g class="n n-data"><rect x="12" y="244" width="164" height="124" rx="26"/><text class="t-title" x="94.0" y="266" text-anchor="middle">presel_mask</text><text class="t-sub" x="94.0" y="283" text-anchor="middle">vsEle and vsMu presel</text><text class="t-sub" x="94.0" y="298" text-anchor="middle">trigger, lepton pT</text><text class="t-sub" x="94.0" y="313" text-anchor="middle">tau pT, jet veto map</text><text class="t-sub" x="94.0" y="328" text-anchor="middle">et mt tt only</text><text class="t-sub" x="94.0" y="343" text-anchor="middle"></text><text class="t-sub" x="94.0" y="358" text-anchor="middle">follows the shifts</text></g><g class="n n-data"><rect x="202" y="244" width="164" height="124" rx="26"/><text class="t-title" x="284.0" y="266" text-anchor="middle">SR_mask, SR_mask_ss</text><text class="t-sub" x="284.0" y="283" text-anchor="middle">presel_mask flags</text><text class="t-sub" x="284.0" y="298" text-anchor="middle">tau + lepton iso</text><text class="t-sub" x="284.0" y="313" text-anchor="middle">mt &lt; 70, lepton veto</text><text class="t-sub" x="284.0" y="328" text-anchor="middle">OS (SR) or SS (SR_ss)</text><text class="t-sub" x="284.0" y="343" text-anchor="middle">tt: both taus, no mt cut</text><text class="t-sub" x="284.0" y="358" text-anchor="middle">follows the shifts</text></g><g class="n n-data"><rect x="392" y="244" width="164" height="124" rx="26"/><text class="t-title" x="474.0" y="266" text-anchor="middle">AR_mask</text><text class="t-sub" x="474.0" y="283" text-anchor="middle">SR_mask with the tau iso</text><text class="t-sub" x="474.0" y="298" text-anchor="middle">inverted (VVVLoose,</text><text class="t-sub" x="474.0" y="313" text-anchor="middle">not Medium)</text><text class="t-sub" x="474.0" y="328" text-anchor="middle">tt: either leg inverted</text><text class="t-sub" x="474.0" y="343" text-anchor="middle">em, mm, ee: not produced</text><text class="t-sub" x="474.0" y="358" text-anchor="middle">follows the shifts</text></g><g class="n n-data"><rect x="582" y="244" width="164" height="124" rx="26"/><text class="t-title" x="664.0" y="266" text-anchor="middle">gen_category_T/J/L</text><text class="t-sub" x="664.0" y="283" text-anchor="middle">T: both legs genuine</text><text class="t-sub" x="664.0" y="298" text-anchor="middle">J: tau leg from a jet</text><text class="t-sub" x="664.0" y="313" text-anchor="middle">L: neither T nor J</text><text class="t-sub" x="664.0" y="328" text-anchor="middle">em: T and L only</text><text class="t-sub" x="664.0" y="343" text-anchor="middle"></text><text class="t-sub" x="664.0" y="358" text-anchor="middle">data: not produced</text></g><g class="n n-data"><rect x="772" y="244" width="164" height="124" rx="26"/><text class="t-title" x="854.0" y="266" text-anchor="middle">ff_* masks</text><text class="t-sub" x="854.0" y="283" text-anchor="middle">qcd: SS, mt &lt; qcd cut</text><text class="t-sub" x="854.0" y="298" text-anchor="middle">wjets: mt &gt;= 70, nb = 0</text><text class="t-sub" x="854.0" y="313" text-anchor="middle">ttbar: nbtag &gt;= 1</text><text class="t-sub" x="854.0" y="328" text-anchor="middle">each as SR-like / AR-like</text><text class="t-sub" x="854.0" y="343" text-anchor="middle">DR_SR, AR_SR, fractions</text><text class="t-sub" x="854.0" y="358" text-anchor="middle">nominal only</text></g><g class="n n-cbt"><rect x="12" y="462" width="300" height="78" rx="10"/><text class="t-title" x="162.0" y="484" text-anchor="middle">BTAG</text><text class="t-sub" x="162.0" y="501" text-anchor="middle">SR_mask: signal region</text><text class="t-sub" x="162.0" y="516" text-anchor="middle">weight_no_btag: no btag SF</text><text class="t-sub" x="162.0" y="531" text-anchor="middle">to measure the efficiency</text></g><g class="n n-cff"><rect x="352" y="462" width="300" height="78" rx="10"/><text class="t-title" x="502.0" y="484" text-anchor="middle">FF-MEASURE</text><text class="t-sub" x="502.0" y="501" text-anchor="middle">presel_mask: preselection</text><text class="t-sub" x="502.0" y="516" text-anchor="middle">ff_* masks: regions to fill</text><text class="t-sub" x="502.0" y="531" text-anchor="middle">weight: MC subtraction</text></g><g class="n n-csh"><rect x="692" y="462" width="400" height="94" rx="10"/><text class="t-title" x="892.0" y="484" text-anchor="middle">SHAPES</text><text class="t-sub" x="892.0" y="501" text-anchor="middle">weight: every MC process</text><text class="t-sub" x="892.0" y="516" text-anchor="middle">SR_mask: OS, SR_mask_ss: QCD ss-os</text><text class="t-sub" x="892.0" y="531" text-anchor="middle">AR_mask: anti-iso for jetFakes</text><text class="t-sub" x="892.0" y="546" text-anchor="middle">gen_category: T/J/L process split</text></g><g class="chip chip-sh"><rect x="1342" y="130" width="54" height="17" rx="8.5"/><text x="1369" y="142" text-anchor="middle">SHAPES</text></g><g class="chip chip-ff"><rect x="1401.6" y="130" width="80" height="17" rx="8.5"/><text x="1442" y="142" text-anchor="middle">FF-MEASURE</text></g><g class="chip chip-bt"><rect x="962" y="130" width="40" height="17" rx="8.5"/><text x="982" y="142" text-anchor="middle">BTAG</text></g><g class="chip chip-ff"><rect x="12" y="374" width="80" height="17" rx="8.5"/><text x="52" y="386" text-anchor="middle">FF-MEASURE</text></g><g class="chip chip-sh"><rect x="202" y="374" width="54" height="17" rx="8.5"/><text x="229" y="386" text-anchor="middle">SHAPES</text></g><g class="chip chip-bt"><rect x="261.6" y="374" width="40" height="17" rx="8.5"/><text x="282" y="386" text-anchor="middle">BTAG</text></g><g class="chip chip-sh"><rect x="392" y="374" width="54" height="17" rx="8.5"/><text x="419" y="386" text-anchor="middle">SHAPES</text></g><g class="chip chip-sh"><rect x="582" y="374" width="54" height="17" rx="8.5"/><text x="609" y="386" text-anchor="middle">SHAPES</text></g><g class="chip chip-ff"><rect x="772" y="374" width="80" height="17" rx="8.5"/><text x="812" y="386" text-anchor="middle">FF-MEASURE</text></g><text class="t-lane" x="20" y="43" text-anchor="start">WEIGHT: ONE MULTIPLICATIVE CHAIN PER EVENT, MC ONLY</text><text class="t-cmd" x="1498" y="43" text-anchor="end">shapes_preparation.py  |  producers/weights.py  |  data and embedding keep a constant weight</text><text class="t-note" x="12" y="170" text-anchor="start">Systematic shifts: a shift only changes the columns it touches, stored under a suffixed name. SHAPES reads the shifted column for that variation.</text><text class="t-lane" x="20" y="227" text-anchor="start">MASKS: 0/1 COLUMNS BUILT FROM THE SELECTION FLAGS</text><text class="t-cmd" x="1498" y="227" text-anchor="end">pair selection, vetoes, isolation and trigger flags are combined in CROWN</text><text class="t-lane" x="20" y="443" text-anchor="start">READ BY</text></svg>