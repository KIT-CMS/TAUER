arker-end="url(#mi)"/><path class="e" d="M588,350 L614,350" marker-end="url(#mi)"/><path class="e" d="M778,350 L804,350" marker-end="url(#mi)"/><path class="e" d="M968,350 L994,350" marker-end="url(#mi)"/><path class="e" d="M1158,350 L1184,350" marker-end="url(#mi)"/><path class="e" d="M398,672 L424,672" marker-end="url(#mi)"/><path class="e" d="M588,672 L614,672" marker-end="url(#mi)"/><path class="e" d="M778,672 L804,672" marker-end="url(#mi)"/><path class="e" d="M968,672 L994,672" marker-end="url(#mi)"/><path class="e" d="M1158,672 L1184,672" marker-end="url(#mi)"/><path class="e" d="M208,474 L234,474" marker-end="url(#mi)"/><path class="e" d="M217,474 L217,82"/><path class="e" d="M217,474 L217,672"/><path class="e" d="M217,216 L234,216" marker-end="url(#mi)"/><path class="e" d="M217,82 L234,82" marker-end="url(#mi)"/><path class="e" d="M217,350 L234,350" marker-end="url(#mi)"/><path class="e" d="M217,672 L234,672" marker-end="url(#mi)"/><path class="e e-friend" d="M208,232 L227,232 L227,496"/><path class="e e-friend" d="M208,366 L227,366 L227,496"/><path class="e e-friend" d="M227,496 L234,496" marker-end="url(#mf)"/><path class="e e-friend" d="M227,340 L234,340" marker-end="url(#mf)"/><path class="e e-rebuild" d="M44,82 L22,82 L22,484 L44,484" marker-end="url(#mr)"/><path class="e e-loop" d="M1076,242 L1076,264 L126,264 L126,242" marker-end="url(#ml)"/><path class="e e-loop" d="M886,108 L886,130 L126,130 L126,108" marker-end="url(#ml)"/><path class="e e-loop" d="M1266,376 L1266,398 L126,398 L126,376" marker-end="url(#ml)"/><g class="n n-ext"><rect x="44" y="458" width="164" height="52" rx="10"/><text class="t-title" x="126.0" y="480" text-anchor="middle">ntuples + selection</text><text class="t-sub" x="126.0" y="497" text-anchor="middle">weight, masks, gen cats</text></g><g class="n n-ext"><rect x="44" y="190" width="164" height="52" rx="10"/><text class="t-title" x="126.0" y="212" text-anchor="middle">FF friend</text><text class="t-sub" x="126.0" y="229" text-anchor="middle">friend tree: ff_weight</text></g><g class="n n-ext"><rect x="44" y="56" width="164" height="52" rx="10"/><text class="t-title" x="126.0" y="78" text-anchor="middle">ntuple production</text><text class="t-sub" x="126.0" y="95" text-anchor="middle">btag_weight inside</text></g><g class="n n-ext"><rect x="44" y="324" width="164" height="52" rx="10"/><text class="t-title" x="126.0" y="346" text-anchor="middle">DNN friend</text><text class="t-sub" x="126.0" y="363" text-anchor="middle">friend tree: NN score</text></g><g class="n n-step"><rect x="234" y="458" width="164" height="52" rx="10"/><text class="t-title" x="316.0" y="480" text-anchor="middle">SHAPES</text><text class="t-sub" x="316.0" y="497" text-anchor="middle">produce_shapes.py</text></g><g class="n n-data"><rect x="424" y="458" width="164" height="52" rx="26"/><text class="t-title" x="506.0" y="480" text-anchor="middle">shapes.root</text><text class="t-sub" x="506.0" y="497" text-anchor="middle">keys = datacard names</text></g><g class="n n-step"><rect x="614" y="458" width="164" height="52" rx="10"/><text class="t-title" x="696.0" y="480" text-anchor="middle">do_estimations.py</text><text class="t-sub" x="696.0" y="497" text-anchor="middle">jetFakes from ff_weight</text></g><g class="n n-step"><rect x="804" y="458" width="164" height="52" rx="10"/><text class="t-title" x="886.0" y="480" text-anchor="middle">make_datacards.py</text><text class="t-sub" x="886.0" y="497" text-anchor="middle">NN / STXS category bins</text></g><g class="n n-data"><rect x="994" y="458" width="164" height="52" rx="26"/><text class="t-title" x="1076.0" y="480" text-anchor="middle">datacards</text><text class="t-sub" x="1076.0" y="497" text-anchor="middle">&lt;ch&gt;/&lt;era&gt;/&lt;bin&gt;.txt</text></g><g class="n n-step"><rect x="1184" y="458" width="164" height="52" rx="10"/><text class="t-title" x="1266.0" y="480" text-anchor="middle">produce_workspace</text><text class="t-sub" x="1266.0" y="497" text-anchor="middle">text2workspace</text></g><g class="n n-step"><rect x="424" y="538" width="164" height="52" rx="10"/><text class="t-title" x="506.0" y="560" text-anchor="middle">PLOT</text><text class="t-sub" x="506.0" y="577" text-anchor="middle">plot_shapes_control.py</text></g><g class="n n-data"><rect x="614" y="538" width="164" height="52" rx="26"/><text class="t-title" x="696.0" y="560" text-anchor="middle">control plots</text><text class="t-sub" x="696.0" y="577" text-anchor="middle">PNG / PDF per variable</text></g><g class="n n-step"><rect x="1184" y="538" width="164" height="52" rx="10"/><text class="t-title" x="1266.0" y="560" text-anchor="middle">run_gof, run_impacts</text><text class="t-sub" x="1266.0" y="577" text-anchor="middle">combine, combineTool</text></g><g class="n n-step"><rect x="234" y="190" width="164" height="52" rx="10"/><text class="t-title" x="316.0" y="212" text-anchor="middle">presel</text><text class="t-sub" x="316.0" y="229" text-anchor="middle">gen-configs, preselection</text></g><g class="n n-data"><rect x="424" y="190" width="164" height="52" rx="26"/><text class="t-title" x="506.0" y="212" text-anchor="middle">preselected ntuples</text><text class="t-sub" x="506.0" y="229" text-anchor="middle">weight + region masks</text></g><g class="n n-step"><rect x="614" y="190" width="164" height="52" rx="10"/><text class="t-title" x="696.0" y="212" text-anchor="middle">ff</text><text class="t-sub" x="696.0" y="229" text-anchor="middle">ff_calculation.py</text></g><g class="n n-step"><rect x="804" y="190" width="164" height="52" rx="10"/><text class="t-title" x="886.0" y="212" text-anchor="middle">ff-corr</text><text class="t-sub" x="886.0" y="229" text-anchor="middle">ff_corrections.py</text></g><g class="n n-data"><rect x="994" y="190" width="164" height="52" rx="26"/><text class="t-title" x="1076.0" y="212" text-anchor="middle">FF payloads</text><text class="t-sub" x="1076.0" y="229" text-anchor="middle">payloads/fake_factors</text></g><g class="n n-step"><rect x="234" y="56" width="164" height="52" rx="10"/><text class="t-title" x="316.0" y="78" text-anchor="middle">presel</text><text class="t-sub" x="316.0" y="95" text-anchor="middle">needs btag ntuples</text></g><g class="n n-data"><rect x="424" y="56" width="164" height="52" rx="26"/><text class="t-title" x="506.0" y="78" text-anchor="middle">jet vectors</text><text class="t-sub" x="506.0" y="95" text-anchor="middle">pt, eta, flavour, score</text></g><g class="n n-step"><rect x="614" y="56" width="164" height="52" rx="10"/><text class="t-title" x="696.0" y="78" text-anchor="middle">calc</text><text class="t-sub" x="696.0" y="95" text-anchor="middle">calculate_efficiency.py</text></g><g class="n n-data"><rect x="804" y="56" width="164" height="52" rx="26"/><text class="t-title" x="886.0" y="78" text-anchor="middle">btag_efficiency</text><text class="t-sub" x="886.0" y="95" text-anchor="middle">.json.gz per era, ch.</text></g><g class="n n-step"><rect x="234" y="324" width="164" height="52" rx="10"/><text class="t-title" x="316.0" y="346" text-anchor="middle">CONFIGS</text><text class="t-sub" x="316.0" y="363" text-anchor="middle">collect-config-only</text></g><g class="n n-data"><rect x="424" y="324" width="164" height="52" rx="26"/><text class="t-title" x="506.0" y="346" text-anchor="middle">config per era, ch.</text><text class="t-sub" x="506.0" y="363" text-anchor="middle">&lt;era&gt;__&lt;ch&gt;__config.yaml</text></g><g class="n n-step"><rect x="614" y="324" width="164" height="52" rx="10"/><text class="t-title" x="696.0" y="346" text-anchor="middle">TRAIN-DATASET</text><text class="t-sub" x="696.0" y="363" text-anchor="middle">merge eras, make folds</text></g><g class="n n-data"><rect x="804" y="324" width="164" height="52" rx="26"/><text class="t-title" x="886.0" y="346" text-anchor="middle">feather folds</text><text class="t-sub" x="886.0" y="363" text-anchor="middle">training/datasets</text></g><g class="n n-step"><rect x="994" y="324" width="164" height="52" rx="10"/><text class="t-title" x="1076.0" y="346" text-anchor="middle">TRAIN</text><text class="t-sub" x="1076.0" y="363" text-anchor="middle">law, uncertainty-aware</text></g><g class="n n-data"><rect x="1184" y="324" width="164" height="52" rx="26"/><text class="t-title" x="1266.0" y="346" text-anchor="middle">NN model</text><text class="t-sub" x="1266.0" y="363" text-anchor="middle">versioned by --tag</text></g><g class="n n-step"><rect x="234" y="646" width="164" height="52" rx="10"/><text class="t-title" x="316.0" y="668" text-anchor="middle">SHAPES</text><text class="t-sub" x="316.0" y="685" text-anchor="middle">--special-analysis TauES</text></g><g class="n n-data"><rect x="424" y="646" width="164" height="52" rx="26"/><text class="t-title" x="506.0" y="668" text-anchor="middle">shapes.root</text><text class="t-sub" x="506.0" y="685" text-anchor="middle">EMB with ES shifts</text></g><g class="n n-step"><rect x="614" y="646" width="164" height="52" rx="10"/><text class="t-title" x="696.0" y="668" text-anchor="middle">do_estimations.py</text><text class="t-sub" x="696.0" y="685" text-anchor="middle">TauES</text></g><g class="n n-step"><rect x="804" y="646" width="164" height="52" rx="10"/><text class="t-title" x="886.0" y="668" text-anchor="middle">make_taues_datacard</text><text class="t-sub" x="886.0" y="685" text-anchor="middle">RooMorphing</text></g><g class="n n-step"><rect x="994" y="646" width="164" height="52" rx="10"/><text class="t-title" x="1076.0" y="668" text-anchor="middle">run_taues_fit</text><text class="t-sub" x="1076.0" y="685" text-anchor="middle">workspace, MultiDimFit</text></g><g class="n n-data"><rect x="1184" y="646" width="164" height="52" rx="26"/><text class="t-title" x="1266.0" y="668" text-anchor="middle">ES scale + uncert.</text><text class="t-sub" x="1266.0" y="685" text-anchor="middle">per category</text></g><text class="t-lane" x="242" y="43" text-anchor="start">B-TAG EFFICIENCY</text><text class="t-cmd" x="1720" y="43" text-anchor="end">run.py BTAG --steps presel,calc  |  condor/submit_btag_efficiency  |  ntuples produced with measure_btag_efficiency = True</text><text class="t-lane" x="242" y="177" text-anchor="start">FAKE FACTORS</text><text class="t-cmd" x="1720" y="177" text-anchor="end">run.py FF-MEASURE --steps presel,ff,ff-corr  |  condor/submit_ff</text><text class="t-lane" x="242" y="311" text-anchor="start">NN TRAINING</text><text class="t-cmd" x="1720" y="311" text-anchor="end">run.py CONFIGS, TRAIN-DATASET, TRAIN  |  condor/submit_train_configs, submit_nn_train  |  et mt tt, with the FF friend</text><text class="t-lane" x="242" y="445" text-anchor="start">SHAPES TO DATACARDS</text><text class="t-cmd" x="1720" y="445" text-anchor="end">run.py SHAPES, PLOT  |  datacards/*.py read shapes.root  |  condor/submit_shapes, submit_estimations, submit_plotting</text><text class="t-lane" x="242" y="633" text-anchor="start">TAU ES</text><text class="t-cmd" x="1720" y="633" text-anchor="end">--special-analysis TauES on the shapes steps  |  condor/submit_taues_fit</text><text class="t-cap" x="44" y="43" text-anchor="start">CROWN / KINGMAKER</text><text class="t-lane" x="242" y="770" text-anchor="start">GUIDED WORKFLOW</text><text class="t-cmd" x="1720" y="770" text-anchor="end">tauer: checks every output, submits the condor steps, copies the payloads to CROWN, prints the local and CROWN commands</text><text class="t-edge t-friend" x="223" y="510" text-anchor="end">friends</text><text class="t-edge t-rebuild" transform="translate(16,283) rotate(-90)" text-anchor="middle">new ntuples, produced first</text><text class="t-edge t-loop" x="234" y="258" text-anchor="start">FF payloads go into the FF friend (copied by tauer)</text><text class="t-edge t-loop" x="234" y="124" text-anchor="start">efficiency goes into the ntuple production (copied by tauer)</text><text class="t-edge t-loop" x="234" y="392" text-anchor="start">model goes into the DNN friend (copied by tauer)</text></svg>