<svg xmlns="http://www.w3.org/2000/svg" width="1772" height="790" viewBox="0 0 1772 790" role="img" aria-label="Every TAUER workflow from CROWN inputs to results, with the results that return to CROWN"><style>
:root{--bg:#ffffff;--surface:#ffffff;--panel:#e9f1ef;--ink:#10201c;--ink-2:#354a45;--muted:#586d68;--line:#bfd2cd;--tauer:#0b7a63;--crown:#1f4e9c;--ext-fill:#e9effa;--artifact:#d8ece6;--loop:#2a8bd6;--friend:#3f9a36}
@media (prefers-color-scheme:dark){:root{--bg:#0b1311;--surface:#13201d;--panel:#101a18;--ink:#e6f2ef;--ink-2:#b2c8c2;--muted:#8aa39c;--line:#26403a;--tauer:#4cba98;--crown:#7ea9f2;--ext-fill:#141f33;--artifact:#1a302b;--loop:#6ec1ff;--friend:#8fdc7a}}
svg{font-family:"Helvetica Neue",Arial,sans-serif}
.bgr{fill:var(--bg)}
.band{fill:var(--panel);stroke:var(--line)}
.n rect{stroke-width:1.6}.n-step rect{fill:var(--surface);stroke:var(--tauer)}.n-ext rect{fill:var(--ext-fill);stroke:var(--crown);stroke-dasharray:6 4}.n-data rect{fill:var(--artifact);stroke:var(--line)}
.t-title{font-weight:600;font-size:13.5px;fill:var(--ink)}
.t-cap{font-weight:600;font-size:10.5px;letter-spacing:.08em;fill:var(--crown)}
.t-sub,.t-cmd{font:10.5px ui-monospace,Menlo,Consolas,monospace;fill:var(--muted)}
.t-lane{font-weight:700;font-size:11px;letter-spacing:.1em;fill:var(--tauer)}
.t-edge{font-weight:500;font-size:11px;fill:var(--ink-2);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.t-loop{fill:var(--loop)}.t-friend{fill:var(--friend)}.t-rebuild{fill:var(--crown)}.t-rebuild{font-weight:600}
.e{fill:none;stroke:var(--ink-2);stroke-width:1.5}.e-loop{stroke:var(--loop);stroke-dasharray:7 5}
.e-friend{stroke:var(--friend);stroke-width:2}.e-rebuild{stroke:var(--crown);stroke-width:3}
.mk{fill:var(--ink-2)}.mk-loop{fill:var(--loop)}.mk-friend{fill:var(--friend)}.mk-rebuild{fill:var(--crown)}
