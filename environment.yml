name: tauer
channels:
  - pytorch=*=cuda*  # CUDA build for the condor GPU trainings; on a GPU-less machine: CONDA_OVERRIDE_CUDA=12.4
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  # core (shape production / plotting / condor submission)
  - numpy
  - scipy
  - pandas
  - matplotlib
  - pyyaml
  - tqdm
  - uproot
  - mplhep
  - root
  - xrootd
  # from fake_factors (KIT-CMS/TauFakeFactors) -- merged in so a separate
  # `fake_factors` conda env is no longer needed
  - correctionlib
  - ruamel.yaml
  - rich
  - questionary>=2.1.1  # tauer TUI; 2.1.0 crashes with prompt_toolkit 3.0.52
  - conda-pack  # ships conda envs to the remote GPU workers (condor/common.py)
  - wurlitzer
  # from trainings/uncertainty-aware-training -- merged in so the separate
  # `uncertainty-training` conda env is no longer needed
  - scikit-learn
  - pytorch=*=cuda*  # CUDA build for the condor GPU trainings; on a GPU-less machine: CONDA_OVERRIDE_CUDA=12.4
  - torchvision=*=cuda*
  - torchaudio=*=cuda*
  - pyarrow
  - dill
  - frozendict
  - more-itertools
  - seaborn
  - onnx
  - onnxscript  # torch.onnx.export(dynamo=True) of the NN fold-combined model
  - pyinstrument  # its profile=True
  - opt_einsum
  - law
  - luigi
  - jupyter
  - ipython
  - ipywidgets
  - papermill
  - typed-argument-parser
  - fsspec
  - gputil
  - pip:
      - tayloranalysis
