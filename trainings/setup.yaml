      is_dyjets_tt: is_DY__ZTT
      is_dyjets_ll: is_DY__ZL
      # is_embedding: is_EMB__EMB
      is_ttbar: 
        - is_TT__TTL
        - is_TT__TTT
      is_diboson: 
        - is_VV__VVL
        - is_VV__VVT
      is_jetFakes: is_data
      # combined category for subleading backgrounds in tt
      is_bkg_rest: 
        - is_TT__TTL
