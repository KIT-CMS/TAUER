    # - DY-ZTT
    # - VV-VVT
    # - TT-TTT
    ## covered by jetFakes with FF
    - DY-ZJ
    - TT-TTJ
    - VV-VVJ
    ## why remove signal ??
    # - qqH125
    # - ggH125
  labels:
    renaming_map:
      # stxs stage 0
      is_ggh_htautau: 
        - is_ggH__ggH125_ggh_htautau_bin101_selection
        - is_ggH__ggH125_ggh_htautau_bin102_selection
        - is_ggH__ggH125_ggh_htautau_bin103_selection
        - is_ggH__ggH125_ggh_htautau_bin104_selection
        - is_ggH__ggH125_ggh_htautau_bin105_selection
        - is_ggH__ggH125_ggh_htautau_bin106_selection
        - is_ggH__ggH125_ggh_htautau_bin107_selection
        - is_ggH__ggH125_ggh_htautau_bin108_selection
        - is_ggH__ggH125_ggh_htautau_bin109_selection
        - is_ggH__ggH125_ggh_htautau_bin110_selection
        - is_ggH__ggH125_ggh_htautau_bin111_selection
        - is_ggH__ggH125_ggh_htautau_bin112_selection
        - is_ggH__ggH125_ggh_htautau_bin113_selection
        - is_ggH__ggH125_ggh_htautau_bin114_selection
        - is_ggH__ggH125_ggh_htautau_bin115_selection
        - is_ggH__ggH125_ggh_htautau_bin116_selection
      is_vbf_htautau: 
        - is_qqH__qqH125_vbf_htautau_bin201_selection
        - is_qqH__qqH125_vbf_htautau_bin202_selection
        - is_qqH__qqH125_vbf_htautau_bin203_selection
        - is_qqH__qqH125_vbf_htautau_bin204_selection
        - is_qqH__qqH125_vbf_htautau_bin205_selection
        - is_qqH__qqH125_vbf_htautau_bin206_selection
        - is_qqH__qqH125_vbf_htautau_bin207_selection
        - is_qqH__qqH125_vbf_htautau_bin208_selection
        - is_qqH__qqH125_vbf_htautau_bin209_selection
        - is_qqH__qqH125_vbf_htautau_bin210_selection
