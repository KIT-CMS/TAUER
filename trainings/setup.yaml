    ## covered by emebedding - not available currently
    # - DY-ZTT
    # - VV-VVT
    # - TT-TTT
    ## covered by jetFakes with FF
    - ZJ
    - TTJ
    - VVJ
    ## why remove signal ??
    # - qqH125
    # - ggH125
  labels:
    renaming_map:
      # stxs stage 0
      is_ggh_htautau: 
        - is_ggH__ggH_htt125_bin101_selection
        - is_ggH__ggH_htt125_bin102_selection
        - is_ggH__ggH_htt125_bin103_selection
        - is_ggH__ggH_htt125_bin104_selection
        - is_ggH__ggH_htt125_bin105_selection
        - is_ggH__ggH_htt125_bin106_selection
        - is_ggH__ggH_htt125_bin107_selection
        - is_ggH__ggH_htt125_bin108_selection
        - is_ggH__ggH_htt125_bin109_selection
        - is_ggH__ggH_htt125_bin110_selection
        - is_ggH__ggH_htt125_bin111_selection
        - is_ggH__ggH_htt125_bin112_selection
        - is_ggH__ggH_htt125_bin113_selection
        - is_ggH__ggH_htt125_bin114_selection
        - is_ggH__ggH_htt125_bin115_selection
        - is_ggH__ggH_htt125_bin116_selection
      is_vbf_htautau: 
        - is_qqH_VH__qqH_htt125_bin201_selection
        - is_qqH_VH__qqH_htt125_bin202_selection
        - is_qqH_VH__qqH_htt125_bin203_selection
        - is_qqH_VH__qqH_htt125_bin204_selection
        - is_qqH_VH__qqH_htt125_bin205_selection
        - is_qqH_VH__qqH_htt125_bin206_selection
        - is_qqH_VH__qqH_htt125_bin207_selection
        - is_qqH_VH__qqH_htt125_bin208_selection
        - is_qqH_VH__qqH_htt125_bin209_selection
        - is_qqH_VH__qqH_htt125_bin210_selection
      # recombined stxs stage 1.2
      is_ggh_htautau_bin101to104:
        - is_ggH__ggH_htt125_bin101_selection
        - is_ggH__ggH_htt125_bin102_selection
        - is_ggH__ggH_htt125_bin103_selection
        - is_ggH__ggH_htt125_bin104_selection
