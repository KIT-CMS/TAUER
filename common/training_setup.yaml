config_modifications:
  general:
    remove_from_config: ["W"] #"DYNLO"
    rename:
      processes:
        data: jetFakes
      subprocesses:
        data_obs: jetFakes
    add_era_and_process_name_flags: true
  specific:
    add_anti_iso_cut_and_weight_version: true

dataset_modifications:
  subprocesses_to_skip:
    ## covered by emebedding - not available currently
    # - DY-ZTT
    # - VV-VVT
    # - TT-TTT
    ## covered by jetFakes with FF
    - ZJ
    - TTJ
    - VVJ
  labels:
    # the signal labels (one per STXS unit the shapes book) are added by run.py TRAIN-DATASET, see write_training_setup()
    renaming_map:
      # backgrounds
      is_dyjets_tt: is_DY__ZTT
      is_dyjets_ll: is_DY__ZL
      # is_embedding: is_EMB__EMB
      is_ttbar: 
        - is_TT__TTL
        - is_TT__TTT
      is_diboson: 
        - is_VV__VVL
        - is_VV__VVT
      is_jetFakes: is_jetFakes__jetFakes  # data is renamed jetFakes above
      # combined category for subleading backgrounds in tt
      is_bkg_rest: 
        - is_TT__TTL
        - is_TT__TTT
        - is_VV__VVL
        - is_VV__VVT
  selections:
    is_dyjets: anti_iso+nominal
    is_dyjets_tt: anti_iso+nominal
    is_dyjets_ll: anti_iso+nominal
    is_embedding: anti_iso+nominal
    is_ttbar: anti_iso+nominal
    is_diboson: anti_iso+nominal
    is_bkg_rest: anti_iso+nominal
    is_jetFakes: anti_iso
    # everything not mentioned here but present in labels renaming_mapping is set to nominal